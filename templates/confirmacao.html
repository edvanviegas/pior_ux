<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Confirmação</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="topo">

    <h1>CONFIRMAÇÃO</h1>

    <div class="progresso">
        Etapa 3 de 4
    </div>

</div>

<div class="caixa confirmacao">

    <h2>Quase terminando!</h2>

    <p>
        Seu cadastro foi provavelmente realizado.
    </p>

    <div class="alerta-amarelo">

        <strong>IMPORTANTE:</strong>

        <p>
            Se você chegou até esta tela, não faça nada.
        </p>

        <p>
            Ou talvez faça.
        </p>

    </div>

    <form method="POST">

        <label>

            <input type="checkbox">

            Confirmo que desejo continuar mesmo sem saber
            exatamente o que estou confirmando.

        </label>

        <br>

        <button type="submit" class="botao-confuso">
            NÃO CLIQUE AQUI
        </button>

    </form>

    <a href="{{ url_for('cadastro') }}" class="voltar">
        ← Voltar e preencher tudo novamente
    </a>

</div>

</body>
</html>
